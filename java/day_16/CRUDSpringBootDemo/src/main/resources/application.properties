spring.application.name=CRUDSpringBootDemo

# Port configuration (essential for Render and container environments)
server.port=${PORT:8080}

# PostgreSQL Database Configuration (Using Supabase IPv4 Pooler with SSL for Render/Cloud)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.vkfsgkryhbrzffqtffpj}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:viven123viven}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
